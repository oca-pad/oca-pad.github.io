<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 8 62 52">
  <!-- Ocarina de cerâmica genérica (desenho próprio do site) -->
  <defs>
    <linearGradient id="barro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaa06a"/>
      <stop offset=".55" stop-color="#cf7a43"/>
      <stop offset="1" stop-color="#a95a2b"/>
    </linearGradient>
    <linearGradient id="bocal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e09060"/>
      <stop offset="1" stop-color="#b0612f"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-18 32 34)">
    <!-- bocal -->
    <rect x="44" y="27" width="17" height="10" rx="3.5" fill="url(#bocal)" stroke="#6e3616" stroke-width="2"/>
    <!-- corpo -->
    <path d="M5 35c0-10 11-16 25-16 13 0 20 6 20 14 0 10-10 16-23 16C14 49 5 44 5 35z" fill="url(#barro)" stroke="#6e3616" stroke-width="2.2"/>
    <!-- brilho -->
    <path d="M13 28c5-3.5 12-4.5 19-3.6" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/>
    <!-- janela (onde o som sai) -->
    <rect x="42.5" y="29.5" width="5" height="4" rx="1" fill="#3b1d0c"/>
    <!-- furos dos dedos -->
    <g fill="#3b1d0c">
      <circle cx="16" cy="35" r="2.6"/>
      <circle cx="23" cy="32.6" r="2.6"/>
      <circle cx="30" cy="32" r="2.6"/>
      <circle cx="37" cy="33.4" r="2.6"/>
      <circle cx="27" cy="41.5" r="1.8"/>
      <circle cx="34" cy="41.6" r="1.8"/>
    </g>
  </g>
</svg>
